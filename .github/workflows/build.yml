name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            artifact: linux-x64
          - os: windows-latest
            qt-host: windows
            qt-arch: win64_msvc2019_64
            artifact: windows-x64
          - os: macos-15
            qt-host: mac
            qt-arch: clang_64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Read and validate app version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match CMake version $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install Ninja and OpenSSL (Ubuntu)
        if: matrix.qt-host == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libcups2-dev libgl1-mesa-dev

      - name: Install Ninja and OpenSSL (macOS)
        if: matrix.qt-host == 'mac'
        run: |
          brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install OpenSSL and verify Windows build tools
        if: matrix.qt-host == 'windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $opensslRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows'
          $requiredPaths = @(
            (Join-Path $opensslRoot 'include\openssl\evp.h'),
            (Join-Path $opensslRoot 'lib\libcrypto.lib'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe')
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) { throw "Required Windows build dependency is missing: $path" }
          }
          Get-Command ninja -ErrorAction Stop | Out-Null
          if (-not (Get-ChildItem (Join-Path $opensslRoot 'bin') -Filter 'libcrypto-*.dll' -File)) {
            throw "OpenSSL libcrypto DLL was not installed by vcpkg"
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV

      - name: Install Qt (with WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          # 6.7.3 supplies prebuilt WebEngine binaries; newer OSS versions
          # require building Qt WebEngine from source.
          version: "6.7.3"
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          modules: qtwebengine qtwebchannel qtpositioning qtserialport
          cache: true

      - name: Set up MSVC
        if: matrix.qt-host == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Linux and macOS)
        if: matrix.qt-host != 'windows'
        shell: bash
        run: |
          cmake_args=(-B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist")
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
            test "$(uname -m)" = "arm64"
          fi
          cmake "${cmake_args[@]}"

      - name: Configure (Windows)
        if: matrix.qt-host == 'windows'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE\dist" "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test (Linux)
        if: matrix.qt-host == 'linux'
        run: ctest --test-dir build -E "smoke_https|browser_window" --output-on-failure

      - name: Test (Windows and macOS)
        if: matrix.qt-host != 'linux'
        run: ctest --test-dir build -E "smoke_https|users|browser_window" --output-on-failure

      - name: Install tree
        run: cmake --install build

      - name: Deploy Qt runtime (Windows)
        if: matrix.qt-host == 'windows'
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw ${{ github.workspace }}/dist/bin/cosmic.exe
          $crypto = Get-ChildItem "$env:ProgramFiles\OpenSSL\bin\libcrypto-*.dll" |
            Select-Object -First 1
          if (-not $crypto) { throw "OpenSSL libcrypto DLL was not found" }
          Copy-Item $crypto.FullName "${{ github.workspace }}\dist\bin" -Force
          $ssl = Get-ChildItem "$env:ProgramFiles\OpenSSL\bin\libssl-*.dll" |
            Select-Object -First 1
          if (-not $ssl) { throw "OpenSSL libssl DLL was not found" }
          Copy-Item $ssl.FullName "${{ github.workspace }}\dist\bin" -Force
          if (-not (Get-ChildItem "${{ github.workspace }}\dist\bin\libcrypto-*.dll" -File)) {
            throw "OpenSSL libcrypto DLL was not staged beside cosmic.exe"
          }

      - name: Create Windows installer
        if: matrix.qt-host == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $iscc installer/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt runtime (macOS)
        if: matrix.qt-host == 'mac'
        run: macdeployqt "${{ github.workspace }}/dist/Cosmic.app" -libpath="$(brew --prefix openssl@3)/lib"

      - name: Create macOS disk image (Apple Silicon)
        if: matrix.qt-host == 'mac'
        run: |
          hdiutil create -volname Cosmic -srcfolder "${{ github.workspace }}/dist/Cosmic.app" \
            -ov -format UDZO "cosmic-${{ steps.version.outputs.value }}-macos-arm64.dmg"

      - name: Download Linux AppImage tools
        if: matrix.qt-host == 'linux'
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl -fsSL \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimage-tools/linuxdeploy-x86_64.AppImage"
          curl -fsSL \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimage-tools/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimage-tools/"*.AppImage

      - name: Create Linux AppImage
        if: matrix.qt-host == 'linux'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          mkdir -p build/appimage
          sed \
            -e 's|^TryExec=.*|TryExec=cosmic|' \
            -e 's|^Exec=.*|Exec=cosmic %u|' \
            dist/share/applications/cosmic.desktop > build/appimage/cosmic.desktop
          "$RUNNER_TEMP/appimage-tools/linuxdeploy-x86_64.AppImage" \
            --appdir AppDir \
            --executable dist/bin/cosmic \
            --desktop-file build/appimage/cosmic.desktop \
            --icon-file dist/share/icons/hicolor/512x512/apps/cosmic.png \
            --plugin qt
          rm -f AppDir/AppRun
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          case "${QT_QPA_PLATFORM%%:*}" in
            wayland|wayland-egl) export QT_QPA_PLATFORM=xcb ;;
          esac
          exec "$APPDIR/usr/bin/cosmic" "$@"
          EOF
          chmod +x AppDir/AppRun
          "$RUNNER_TEMP/appimage-tools/linuxdeploy-x86_64.AppImage" \
            --appdir AppDir \
            --output appimage
          image="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$image"
          mv "$image" "cosmic-${APP_VERSION}-linux-x64.AppImage"

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-${{ steps.version.outputs.value }}-${{ matrix.artifact }}
          path: |
            cosmic-*.exe
            cosmic-*.AppImage
            cosmic-*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cosmic-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Cosmic ${{ github.ref_name }}
          body: |
            ## Cosmic browser

            Cosmic is a customizable, privacy-focused desktop browser built with C++20, Qt 6 and Chromium WebEngine.

            Download Cosmic from https://francydg2.github.io/cosmic-browser/.

            ### What it does

            - Browses the web with tabs, pinned tabs, tab groups and multiple user profiles.
            - Searches from the address bar with configurable search engines.
            - Restores browsing sessions and provides bookmarks, including quick links on the new-tab page.
            - Offers request blocking, HTTPS-only mode, configurable site permissions and session-only cookies.
            - Includes an encrypted password vault, customizable toolbar and appearance settings.

            ### Downloads

            - **Windows x64:** `cosmic-<version>-windows-x64.exe`
            - **Apple Silicon (arm64):** `cosmic-<version>-macos-arm64.dmg`
            - **Linux x64:** `cosmic-<version>-linux-x64.AppImage`

            The Windows installer is unsigned and may trigger SmartScreen. The macOS app is unsigned and not notarized, so Gatekeeper may warn when opening it.
          files: release-assets/*
