<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Nebula: original local artwork. No emoji, no external assets. -->
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#5b4bc9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#b3a8ff"/>
    </linearGradient>
  </defs>

  <!-- stars -->
  <circle cx="34" cy="46" r="1.6" fill="#ffffff" opacity="0.55"/>
  <circle cx="164" cy="38" r="1.2" fill="#ffffff" opacity="0.40"/>
  <circle cx="176" cy="140" r="1.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="44" cy="152" r="1.3" fill="#ffffff" opacity="0.45"/>
  <circle cx="100" cy="22" r="1.1" fill="#ffffff" opacity="0.30"/>
  <circle cx="24" cy="108" r="1.0" fill="#ffffff" opacity="0.30"/>

  <!-- ring (behind) -->
  <ellipse cx="100" cy="104" rx="74" ry="24" fill="none" stroke="url(#ring)"
           stroke-width="7" transform="rotate(-16 100 104)" opacity="0.9"/>

  <!-- planet -->
  <circle cx="100" cy="100" r="44" fill="url(#planet)"/>
  <ellipse cx="86" cy="86" rx="16" ry="10" fill="#ffffff" opacity="0.14"
           transform="rotate(-24 86 86)"/>

  <!-- ring (front, bottom sweep drawn over the planet) -->
  <path d="M 26 104 A 74 24 0 0 0 174 104" fill="none" stroke="url(#ring)"
        stroke-width="7" stroke-linecap="round" transform="rotate(-16 100 104)" opacity="0.9"/>
</svg>
